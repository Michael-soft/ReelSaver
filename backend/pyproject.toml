[project]
name = "reelsaver-backend"
version = "1.0.0"
description = "ReelSaver backend — Flask API for yt-dlp powered downloads"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-dance[google]>=7.1.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-limiter>=3.8.0",
    "flask-migrate>=4.0.7",
    "alembic>=1.13.0",
    "gunicorn>=25.3.0",
    "oauthlib>=3.3.1",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.1",
    "yt-dlp>=2026.3.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
