services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - downloads:/app/downloads
      - cookies:/app/cookies
    depends_on:
      - redis
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5000:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  downloads:
  cookies:
  redis-data:
